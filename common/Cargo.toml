[package]
name = "themis_common"
description = "Common library for the Themis project"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license-file.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
anyhow = { version = "1.0" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = { version = "0.15" }
diesel = { version = "2.1", features = ["chrono", "postgres", "r2d2", "serde_json"] }
futures = { version = "0.3.30" }
log = { version = "0.4" }
lipsum = { git = "https://github.com/mgeisler/lipsum.git" }
rand = { version = "0.9" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
reqwest-leaky-bucket = { version = "0.3.0" }
reqwest-middleware = { version = "0.4.0" }
reqwest-retry = { version = "0.7.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde-jsonlines = { version = "0.7.0" }
sluggify = { version = "0.1" }
derive_more = { version = "2.1", features = ["display"] }
