[package]
name = "themis_common"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { version = "1.0" }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = { version = "0.15" }
diesel = { version = "2.1", features = ["chrono", "postgres", "r2d2", "serde_json"] }
rand = { version = "0.9" }
serde = { version = "1.0", features = ["derive"] }
log = { version = "0.4" }
lipsum = { git = "https://github.com/mgeisler/lipsum.git" }
sluggify = { version = "0.1" }
derive_more = { version = "2.1", features = ["display"] }
